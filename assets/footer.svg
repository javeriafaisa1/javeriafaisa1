<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" font-family="'Courier New',Courier,monospace"><style>.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style><defs><linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff00cc"/><stop offset=".5" stop-color="#7b2ff7"/><stop offset="1" stop-color="#00f0ff"/></linearGradient><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0" y="10" width="900" height="3" fill="url(#fl)" filter="url(#glow)"/><text x="450" y="50" text-anchor="middle" font-size="15" fill="#d5c6ff" font-style="italic">"First, solve the problem. Then, write the code." - John Johnson</text><text x="450" y="82" text-anchor="middle" font-size="13" fill="#00f0ff" letter-spacing="4">// END OF TRANSMISSION<tspan class="bl" fill="#ff00cc"> _</tspan></text></svg>