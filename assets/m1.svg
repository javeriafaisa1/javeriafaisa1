<svg xmlns="http://www.w3.org/2000/svg" width="440" height="196" viewBox="0 0 440 196" font-family="'Courier New',Courier,monospace"><style>.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style><defs><linearGradient id="ed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff00cc"/><stop offset="1" stop-color="#00f0ff"/></linearGradient></defs><polygon points="0,0 410,0 440,30 440,196 30,196 0,166" fill="#0d0221" stroke="url(#ed)" stroke-width="2"/><text x="24" y="34" font-size="12" fill="#ff00cc" letter-spacing="3">MISSION_01</text><circle class="bl" cx="372" cy="30" r="4" fill="#3dffb5"/><text x="418" y="34" font-size="11" fill="#3dffb5" text-anchor="end" letter-spacing="1">DONE</text><text x="24" y="64" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="2">STEGANOGRAPHY</text><text x="24" y="92" font-size="13" fill="#d5c6ff">Hides secret messages inside PNG, JPG, MP3</text><text x="24" y="112" font-size="13" fill="#d5c6ff">and MP4 with LSB encoding. Password</text><text x="24" y="132" font-size="13" fill="#d5c6ff">protected, SHA-256 verified.</text><rect x="24" y="152" width="42" height="22" fill="none" stroke="#00f0ff" stroke-opacity=".8"/><text x="45.0" y="167" font-size="11" fill="#00f0ff" text-anchor="middle" letter-spacing="1">LSB</text><rect x="74" y="152" width="74" height="22" fill="none" stroke="#00f0ff" stroke-opacity=".8"/><text x="111.0" y="167" font-size="11" fill="#00f0ff" text-anchor="middle" letter-spacing="1">SHA-256</text><rect x="156" y="152" width="82" height="22" fill="none" stroke="#00f0ff" stroke-opacity=".8"/><text x="197.0" y="167" font-size="11" fill="#00f0ff" text-anchor="middle" letter-spacing="1">CYBERSEC</text></svg>